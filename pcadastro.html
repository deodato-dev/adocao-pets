<!DOCTYPE html>
<html>
<head>
<title>Formulario de cadastro</title>

</head>

<body>
    <h1>Formulario de cadastro </h1>
    <h2></h2>Reaize o seu cadastro com seus dados atualizados 

    <div>
        <form action="Dados Cadastrais">
            <!--O usuario ira preencher as informações de forma obrigatoria-->
            <div>
            <label for="nome">Nome completo</label>
            <input type="text"  name="nome completo" placeholder="Digite seu nome" required>
            </div>

            <div>   
            <label for="telefone">telefone</label>
            <input type="tel"      name="telefone" placeholder="(83) 99876-6544"><br>
            </div> 
            
            <div>
            <label for="Endereço de email"> Endereço de email</label>
            <input type="text"  name="Endereço de email" placeholder="Digite seu email " requireds>
            </div>
            
            <!--Aqui o usuario ira criar sua senha-->
            <div>
            <label for="senha">Crie um senha</label>
            <input type="number" class="" name="senha" placeholder="40028922" required>
            </div>
    </div>




    </form>
    
</body>
</html>
