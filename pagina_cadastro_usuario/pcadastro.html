    <div class="formulario_fora">
        <div class="cabecalho">
            <h2>Realize o seu cadastro com seus dados atualizados</h2>
        </div>   
        <form   id="meuForm" class="formulario_dentro" action="Dados Cadastrais">
            <!--O usuario ira preencher as informações de forma obrigatoria-->
            <div class="dados">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome"  name="nome completo" placeholder="Digite seu nome" required>
                <span id="erroNome"  ></span>
            </div>

            <div class="dados">   
                <label for="telefone">telefone</label>
                <input type="number"    id="telefone"  maxlength="11" name="telefone" placeholder="(83) 99876-6544" required>
                <span id="erroTelfone"></span>
            </div> 
            
            <div class="dados">
                <label for="Endereço de email"> Endereço de email</label>
                <input type="text"   id="email"  name="Endereço de email" placeholder="Digite seu email " required>
                <span id="erroEmail"></span>
            </div>
            
            <div class="dados">
              <label for="opcao"> Escolha  :</label>
              <select id="opcao" name="opcao">
                <option value="" disabled selected>Selecione...</option>
                <option value="">Adotar um pet </option>
                <option value="">Doar um pet  </option>
                <option value="">Animais perdidos</option>                  
              </select>
            </div>
            <!--Aqui o usuario ira criar sua senha-->
            <div class="dados">
            <label for="senha">Crie um senha</label>
            <input type="number"  id="senha" class="" name="senha" placeholder="40028922" required>
            <span id="erroSenha"></span>
            </div>

            <!--Aqui sera para o usuario confirmar a senha-->
            <Div class="dados">
               <label for="senha">Confirme sua senha</label>
               <input type="number" id="confirmarsenha" class="" name="confirmarsenha" placeholder="40028922" required>
               <span id="erroConfirmarsenha"   ></span>
            </Div>
        <div class="submit_botao">
            <!--botão-->
            <button type="submit" class="btn btn-criar fw-bold">confirmar dados </button>
        </div>
    </form>
      </div>
