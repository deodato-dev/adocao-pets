    <div class="formulario_fora">
        <div class="cabecalho">
            <h2>Realize o seu cadastro com seus dados atualizados</h2>
        </div>   

        <form id="meuForm" class="formulario_dentro" action="Dados Cadastrais">
            <div class="dados">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome completo" placeholder="Digite seu nome" required>
            </div>
            <span id="erroNome" class="text-danger small mb-2"></span>

            <div class="dados">   
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" maxlength="15" name="telefone" placeholder="(83) 99876-6544" required>
            </div>
            <span id="erroTelefone" class="text-danger small mb-2"></span>
            
            <div class="dados">
                <label for="email">Endereço de e-mail</label>
                <input type="email" id="email" name="Endereço de email" placeholder="Digite seu email" required>
            </div>
            <span id="erroEmail" class="text-danger small mb-2"></span>
            
            <div class="dados">
                <label for="opcao">Escolha:</label>
                <select id="opcao" name="opcao">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="adotar">Adotar um pet</option>
                    <option value="doar">Doar um pet</option>
                    <option value="perdidos">Animais perdidos</option>                  
                </select>
            </div>

            <div class="dados">
                <label for="senha">Crie uma senha</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
            </div>
            <span id="erroSenha" class="text-danger small mb-2"></span>

            <div class="dados">
                <label for="confirmarsenha">Confirme sua senha</label>
                <input type="password" id="confirmarsenha" name="confirmarsenha" placeholder="Repita a senha" required>
            </div>
            <span id="erroConfirmarsenha" class="text-danger small mb-2"></span>

            <div class="submit_botao">
                <button type="submit" class="btn btn-criar fw-bold">Confirmar dados</button>
            </div>
        </form>
    </div>
       
     <footer class="footer-artesanal py-5 mt-auto">
  <div class="container text-center">

    <!-- Selo com a logo -->
    <div class="selo-footer d-inline-flex align-items-center justify-content-center px-4 py-2 mb-4">
